version: 2

project_name: arco

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/arco
    binary: arco
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/dinhlongviolin1/arco/internal/cli.version={{.Version}}

archives:
  - formats: [tar.gz]
    # Lowercase, stable names: arco_linux_amd64.tar.gz etc.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

# Homebrew is handled by a dedicated release-workflow step (not goreleaser):
# goreleaser's cask output is macOS-only, but our hand-generated formula covers
# macOS AND Linux (Linuxbrew). See .github/workflows/release.yml (same layout
# as clavis).

# Scoop bucket for Windows users: pushes a manifest to
# dinhlongviolin1/scoop-bucket. Gated on SCOOP_BUCKET_TOKEN the same way.
scoops:
  - name: arco
    skip_upload: '{{ if isEnvSet "SCOOP_BUCKET_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: dinhlongviolin1
      name: scoop-bucket
      token: '{{ envOrDefault "SCOOP_BUCKET_TOKEN" "" }}'
    homepage: "https://github.com/dinhlongviolin1/arco"
    description: "Command your worker agents the way a bow commands the strings"
    license: Apache-2.0

release:
  draft: false
  prerelease: auto
