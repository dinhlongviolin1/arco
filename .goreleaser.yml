version: 2

project_name: arco

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/arco
    binary: arco
    env:
      - CGO_ENABLED=0
    # No windows: arco is a unix daemon (unix sockets, herdr, SO_PEERCRED,
    # flock single-instance lock). darwin is CLI/dev convenience.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/dinhlongviolin1/arco/internal/cli.version={{.Version}}

archives:
  - formats: [tar.gz]
    # Lowercase, stable names: arco_linux_amd64.tar.gz etc.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

# Homebrew is handled by a dedicated release-workflow step (not goreleaser):
# goreleaser's cask output is macOS-only, but our hand-generated formula covers
# macOS AND Linux (Linuxbrew). See .github/workflows/release.yml (same layout
# as clavis).

# No scoop bucket: arco does not ship Windows binaries (unix daemon).

release:
  draft: false
  prerelease: auto
